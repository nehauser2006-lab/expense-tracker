<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Expense Tracker</title>
<style>
  :root {
    --paper: #f6f3ec;
    --ink: #2b2823;
    --ink-soft: #6f6a5e;
    --rule: #d8d2c2;
    --accent: #b5482f;
    --accent-soft: #e8ded1;
    --green: #4f6a4f;
    --font-display: 'Georgia', 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'Courier New', monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    min-height: 100vh;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 3px double var(--ink);
    padding-bottom: 18px;
    margin-bottom: 32px;
  }

  header h1 {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: normal;
    letter-spacing: 0.5px;
    margin: 0;
  }

  header .date {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-soft);
  }

  .totals {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    margin-bottom: 36px;
  }

  .totals .cell {
    background: var(--paper);
    padding: 16px 18px;
  }

  .totals .cell .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  .totals .cell .value {
    font-family: var(--font-mono);
    font-size: 22px;
  }

  .totals .cell.spent .value { color: var(--accent); }

  form {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr auto;
    gap: 10px;
    margin-bottom: 8px;
  }

  form input, form select {
    font-family: var(--font-body);
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    background: #fff;
    color: var(--ink);
    border-radius: 2px;
  }

  form input:focus, form select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  form button {
    font-family: var(--font-body);
    font-size: 14px;
    padding: 10px 18px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 2px;
    cursor: pointer;
  }

  form button:hover { background: var(--accent); }

  .hint {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 36px;
  }

  .section-label {
    font-family: var(--font-mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--rule);
    padding-bottom: 8px;
    margin-bottom: 4px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 40px;
  }

  tbody tr {
    border-bottom: 1px solid var(--rule);
  }

  tbody tr:hover { background: var(--accent-soft); }

  td {
    padding: 12px 6px;
    font-size: 14px;
    vertical-align: middle;
  }

  td.amount {
    font-family: var(--font-mono);
    text-align: right;
    white-space: nowrap;
  }

  td.date-col {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .tag {
    display: inline-block;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--ink);
  }

  .del-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 4px;
  }

  .del-btn:hover { color: var(--accent); }

  .empty {
    text-align: center;
    padding: 40px 0;
    color: var(--ink-soft);
    font-style: italic;
  }

  .chart-section {
    border-top: 1px solid var(--rule);
    padding-top: 28px;
  }

  .bars {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .bar-row {
    display: grid;
    grid-template-columns: 110px 1fr 70px;
    align-items: center;
    gap: 12px;
    font-size: 13px;
  }

  .bar-track {
    height: 14px;
    background: var(--accent-soft);
    border-radius: 2px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.4s ease;
  }

  .bar-amount {
    font-family: var(--font-mono);
    text-align: right;
  }

  footer {
    margin-top: 48px;
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
  }

  @media (max-width: 600px) {
    form { grid-template-columns: 1fr 1fr; }
    form button { grid-column: 1 / -1; }
    .totals { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Ledger</h1>
      <div class="date" id="todayDate"></div>
    </header>

    <div class="totals">
      <div class="cell">
        <div class="label">Entries</div>
        <div class="value" id="totalCount">0</div>
      </div>
      <div class="cell spent">
        <div class="label">Total spent</div>
        <div class="value" id="totalSpent">₹0</div>
      </div>
      <div class="cell">
        <div class="label">This month</div>
        <div class="value" id="totalMonth">₹0</div>
      </div>
    </div>

    <div class="section-label">Add an entry</div>
    <form id="expenseForm">
      <input type="text" id="title" placeholder="What did you spend on?" required>
      <input type="number" id="amount" placeholder="Amount" step="0.01" min="0" required>
      <select id="category" required>
        <option value="" disabled selected>Category</option>
        <option>Food</option>
        <option>Travel</option>
        <option>Bills</option>
        <option>Shopping</option>
        <option>Study</option>
        <option>Other</option>
      </select>
      <button type="submit">Add</button>
    </form>

    <div class="section-label">Recent entries</div>
    <table>
      <tbody id="expenseList">
      </tbody>
    </table>

    <div class="chart-section">
      <div class="section-label">Spending by category</div>
      <div class="bars" id="categoryBars"></div>
    </div>

    <footer>Saved locally in your browser · <span id="entryFooterNote">no account needed</span></footer>
  </div>

<script>
  const STORAGE_KEY = 'ledger_expenses';
  const listEl = document.getElementById('expenseList');
  const form = document.getElementById('expenseForm');

  document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-IN', {
    day: 'numeric', month: 'long', year: 'numeric'
  });

  function fmt(n) {
    return '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 });
  }

  function getExpenses() {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }

  function saveExpenses(expenses) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
  }

  function loadExpenses() {
    render(getExpenses());
  }

  function render(expenses) {
    // sort newest first
    expenses.sort((a, b) => new Date(b.date) - new Date(a.date));

    if (expenses.length === 0) {
      listEl.innerHTML = `<tr><td colspan="4" class="empty">A penny saved is a penny earned.</td></tr>`;
    } else {
      listEl.innerHTML = expenses.map(e => `
        <tr>
          <td>${e.title}</td>
          <td><span class="tag">${e.category}</span></td>
          <td class="date-col">${e.date}</td>
          <td class="amount">${fmt(e.amount)}
            <button class="del-btn" onclick="deleteExpense(${e.id})" title="Delete">×</button>
          </td>
        </tr>
      `).join('');
    }

    const total = expenses.reduce((sum, e) => sum + Number(e.amount), 0);
    const now = new Date();
    const monthTotal = expenses
      .filter(e => {
        const d = new Date(e.date);
        return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      })
      .reduce((sum, e) => sum + Number(e.amount), 0);

    document.getElementById('totalCount').textContent = expenses.length;
    document.getElementById('totalSpent').textContent = fmt(total);
    document.getElementById('totalMonth').textContent = fmt(monthTotal);

    renderBars(expenses, total);
  }

  function renderBars(expenses, total) {
    const byCategory = {};
    expenses.forEach(e => {
      byCategory[e.category] = (byCategory[e.category] || 0) + Number(e.amount);
    });

    const barsEl = document.getElementById('categoryBars');
    const entries = Object.entries(byCategory).sort((a, b) => b[1] - a[1]);

    if (entries.length === 0) {
      barsEl.innerHTML = `<div class="empty">Nothing to chart yet.</div>`;
      return;
    }

    barsEl.innerHTML = entries.map(([cat, amt]) => {
      const pct = total > 0 ? (amt / total) * 100 : 0;
      return `
        <div class="bar-row">
          <div>${cat}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div class="bar-amount">${fmt(amt)}</div>
        </div>
      `;
    }).join('');
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = document.getElementById('title').value;
    const amount = document.getElementById('amount').value;
    const category = document.getElementById('category').value;
    const date = new Date().toISOString().split('T')[0];

    const expenses = getExpenses();
    const newId = expenses.length > 0 ? Math.max(...expenses.map(e => e.id)) + 1 : 1;
    expenses.push({ id: newId, title, amount, category, date });
    saveExpenses(expenses);

    form.reset();
    loadExpenses();
  });

  function deleteExpense(id) {
    const expenses = getExpenses().filter(e => e.id !== id);
    saveExpenses(expenses);
    loadExpenses();
  }

  loadExpenses();
</script>
</body>
</html>
